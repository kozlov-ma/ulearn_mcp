[package]
name = "ulearn-mcp"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Local MCP server for ulearn courses, student submissions and instructor reviews"
license = "MIT"
repository = "https://github.com/kozlov-ma/ulearn_mcp"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1"
rpassword = "7"
tempfile = "3"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "3.8", features = ["transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }

[dev-dependencies]
wiremock = "0.6"
